<!DOCTYPE html>

<html>

<head>

```
<title>Forgot Password</title>

<style>

    body {
        font-family: Georgia, serif;
        background: #fff4e6;
        color: #4a2c20;
        width: 400px;
        margin: 80px auto;
    }

    .forgot-card {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
    }

    h2 {
        text-align: center;
        color: #e85d04;
        font-size: 30px;
        margin-bottom: 25px;
    }

    .description {
        text-align: center;
        font-family: Arial, sans-serif;
        color: #666;
        line-height: 1.5;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        box-sizing: border-box;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #e85d04;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border: none;
        border-radius: 8px;
        background: #e85d04;
        color: white;
        font-size: 16px;
        font-family: Arial, sans-serif;
        cursor: pointer;
    }

    button:hover {
        background: #d94f00;
    }

    #message {
        text-align: center;
        font-family: Arial, sans-serif;
        margin-top: 20px;
    }

</style>
```

</head>

<body>

```
<div class="forgot-card">

    <h2>🔑 Forgot Password?</h2>

    <p class="description">
        Enter your registered email address and
        we'll send you a password reset link.
    </p>

    <input
        id="email"
        placeholder="Enter email">

    <button onclick="sendResetLink()">
        Send Reset Link
    </button>

    <p id="message"></p>

</div>

<script src="forgot-password.js"></script>
```

</body>

</html>
