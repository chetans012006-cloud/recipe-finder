<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Kitchen AI</title>

    <!-- Common website CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Kitchen AI CSS -->
    <link rel="stylesheet" href="kitchen-ai.css">
</head>

<body>

    <div class="kitchen-ai-page">

        <h1>👨‍🍳 Kitchen AI</h1>

        <p>
            Your personal cooking assistant
        </p>


        <div class="ai-box">

            <h2>What do you have in your kitchen?</h2>

            <input
                type="text"
                id="kitchenInput"
                placeholder="Example: chicken, rice, onion"
            >

            <button onclick="askKitchenAI()">
                Ask Kitchen AI 🤖
            </button>

        </div>


        <div id="kitchenResult">

        </div>

    </div>


    <script src="kitchen-ai.js"></script>

</body>

</html>
